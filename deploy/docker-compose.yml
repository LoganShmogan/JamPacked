# JamPacked on loganserver: self-hosted Convex + nginx serving the Flutter web build and the website.
# nginx serves the app and proxies /api/* to Convex, so one hostname covers both; the website (web/)
# is served for jampacked.co.nz and www. The shared Caddy proxy (~/caddy) routes all three ->
# foodsafe:80 over the `web` network.
services:
  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: foodsafe-convex
    restart: unless-stopped
    stop_grace_period: 10s
    volumes:
      - convex-data:/convex/data
    environment:
      - INSTANCE_NAME=foodsafe
      - CONVEX_CLOUD_ORIGIN=https://app.jampacked.co.nz
      - CONVEX_SITE_ORIGIN=https://app.jampacked.co.nz/http
    ports:
      - "127.0.0.1:3210:3210" # loopback only: used to push functions over an SSH tunnel
    networks: [internal]
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  web:
    image: nginx:1.27-alpine
    container_name: foodsafe
    restart: unless-stopped
    depends_on: [convex]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./site:/usr/share/nginx/site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal, web]

networks:
  internal:
  web:
    external: true

volumes:
  convex-data:
