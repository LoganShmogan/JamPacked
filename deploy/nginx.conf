server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://convex:3210;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Revalidate everything on each load (cheap 304s) so a deploy shows up straight away. Without a
  # header, Cloudflare caches .js/.png at its edge and tells browsers to keep them for hours.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Fingerprinted by deploy.sh: a new build gets new names, so these can be cached for good.
  location ~ "^/(main\.dart|flutter_bootstrap)\.[0-9a-f]{12}\.js$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
