# www is the same site: send it to the bare domain, so search engines see one copy of each page.
server {
  listen 80;
  server_name www.jampacked.co.nz;
  return 301 https://jampacked.co.nz$request_uri;
}

# The website (web/, a static Next.js export) on the bare domain.
server {
  listen 80;
  server_name jampacked.co.nz;
  root /usr/share/nginx/site;
  absolute_redirect off; # /admin -> /admin/ keeps the https the visitor came in on

  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;

  # Next.js fingerprints these itself, so they can be cached for good.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

# The Flutter web app and the Convex API: app.jampacked.co.nz (and anything else).
# Kept out of search results (X-Robots-Tag on every response) so searches land on the website. A
# location with its own add_header drops the server's, so each one repeats it.
server {
  listen 80 default_server;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://convex:3210;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Revalidate everything on each load (cheap 304s) so a deploy shows up straight away. Without a
  # header, Cloudflare caches .js/.png at its edge and tells browsers to keep them for hours.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Fingerprinted by deploy.sh: a new build gets new names, so these can be cached for good.
  location ~ "^/(main\.dart|flutter_bootstrap)\.[0-9a-f]{12}\.js$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
